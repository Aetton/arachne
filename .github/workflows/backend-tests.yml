name: Backend tests

on:
  pull_request:
    paths:
      - "api/**"
      - "tests/**"
      - "tofu/**"
      - ".github/workflows/backend-tests.yml"
  push:
    branches:
      - main
    paths:
      - "api/**"
      - "tests/**"
      - "tofu/**"
      - ".github/workflows/backend-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --disable-pip-version-check -r api/requirements.txt
          python -m pip install --disable-pip-version-check -r tests/requirements.txt

      - name: Compile backend
        run: python -m compileall -q api tests

      - name: Run backend tests
        run: |
          set -uo pipefail
          failures=0
          for test_file in tests/test_*.py; do
            echo "::group::$(basename "$test_file")"
            test_dir="$(mktemp -d)"
            DATABASE_URL="sqlite:///$test_dir/test.db" \
              python -m unittest discover -s tests -p "$(basename "$test_file")" -v
            result=$?
            rm -rf -- "$test_dir"
            echo "::endgroup::"
            if [ "$result" -ne 0 ]; then
              failures=$((failures + 1))
              echo "::error::$(basename "$test_file") failed"
            fi
          done
          if [ "$failures" -ne 0 ]; then
            echo "::error::$failures test modules failed"
            exit 1
          fi

  tofu-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenTofu
        run: |
          curl --fail --show-error --location --output /tmp/tofu.zip \
            https://github.com/opentofu/opentofu/releases/download/v1.12.6/tofu_1.12.6_linux_amd64.zip
          unzip -q /tmp/tofu.zip tofu -d /tmp/tofu-bin
          echo /tmp/tofu-bin >> "$GITHUB_PATH"
      - name: Validate oVirt module against provider schema
        working-directory: tofu/ovirt
        run: |
          tofu init -backend=false -input=false -lockfile=readonly
          tofu validate -no-color
