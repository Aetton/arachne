name: Backend tests

on:
  pull_request:
    paths:
      - "api/**"
      - "tests/**"
      - "tofu/**"
      - ".github/workflows/backend-tests.yml"
  push:
    branches:
      - main
    paths:
      - "api/**"
      - "tests/**"
      - "tofu/**"
      - ".github/workflows/backend-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check -r api/requirements.txt

      - name: Compile backend
        run: python -m compileall -q api tests

      - name: Run backend tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

  tofu-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenTofu
        run: |
          curl --fail --show-error --location --output /tmp/tofu.zip \
            https://github.com/opentofu/opentofu/releases/download/v1.12.6/tofu_1.12.6_linux_amd64.zip
          unzip -q /tmp/tofu.zip tofu -d /tmp/tofu-bin
          echo /tmp/tofu-bin >> "$GITHUB_PATH"
      - name: Validate oVirt module against provider schema
        working-directory: tofu/ovirt
        run: |
          tofu init -backend=false -input=false -lockfile=readonly
          tofu validate -no-color
